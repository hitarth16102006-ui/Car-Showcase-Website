<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AUTOVERSE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../CSS/style.css">
  <link rel="stylesheet" href="../CSS/login.css">
  <link rel="stylesheet" href="../CSS/responsive.css">
</head>
<body>

<header class="header">
  <nav class="navbar">
    <div class="nav-logo">
      <span class="logo-auto">AUTO</span>
      <span class="logo-verse">VERSE</span>
    </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="cars.html">Cars</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="signup.html" class="signup-btn">Signup</a></li>
    </ul>
  </nav>
</header>

<main class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p>Login to your AUTOVERSE account</p>

    <form class="auth-form">
      <input type="email" placeholder="Email Address" required>
      <input type="password" placeholder="Password" required>
      <button type="submit" class="btn btn-red">Login</button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a href="signup.html">Signup</a>
    </p>
  </div>
</main>

</body>
</html>
